[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auspicious-investors"
version = "0.1.0"
description = "Auditable multilingual calendar-belief investment experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gcp = ["google-auth>=2.29,<3", "requests>=2.32,<3", "google-cloud-storage>=2.18,<4"]
openweights = ["numpy>=1.26", "torch>=2.2", "transformers>=4.45,<5", "safetensors>=0.4"]

[project.scripts]
auspicious = "auspicious.cli:main"

[tool.setuptools.packages.find]
include = ["auspicious*"]
